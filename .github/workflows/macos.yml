name: Build and publish universal macOS installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing official release tag; leave blank to validate without publishing
        required: false
        type: string

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      SKYDEK_MAC_UNIVERSAL: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Validate macOS metadata
        run: plutil -lint src-tauri/Info.plist
      - name: Prepare universal MP3 encoder
        run: npm run build:encoder
      - name: Test UI logic
        run: npm run test:ui
      - name: Build frontend
        run: npm run build
      - name: Test Rust backend on macOS
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build universal DMG and signed updater
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.release_tag }}
          releaseName: ${{ inputs.release_tag && format('SkyDek DJ {0}', inputs.release_tag) || '' }}
          releaseBody: |
            SkyDek DJ 1.1.0 is the official public launch release, with the complete controller-ready two-deck workflow, sampler, recording, Mix Editor, Auto DJ, microphone controls, headphone cue output, and signed updates.

            Choose the Windows installer or the universal macOS DMG below. The Mac build uses ad-hoc Apple code signing, so macOS may ask you to allow the app in Privacy & Security on first launch.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --bundles app,dmg --target universal-apple-darwin
      - name: Verify bundled Mac resources and architecture
        run: bash scripts/verify-macos-dmg.sh src-tauri/target/universal-apple-darwin/release/bundle/dmg
      - name: Retain Mac package for build inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skydek-macos-validation
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

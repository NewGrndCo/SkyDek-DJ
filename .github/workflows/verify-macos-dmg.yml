name: Verify previously built macOS installer

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: GitHub Actions run containing skydek-macos-validation
        required: true
        type: string

jobs:
  verify-macos-dmg:
    runs-on: macos-latest
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Download built DMG
        uses: actions/download-artifact@v4
        with:
          name: skydek-macos-validation
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/skydek-macos-validation
      - name: Verify installer contents
        run: bash scripts/verify-macos-dmg.sh "${{ runner.temp }}/skydek-macos-validation"

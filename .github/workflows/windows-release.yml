name: Publish signed Windows update

on:
  push:
    tags:
      - "v*"

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Test UI logic
        run: npm run test:ui
      - name: Build frontend
        run: npm run build
      - name: Prepare bundled MP3 encoder
        run: npm run build:encoder
      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build, sign, and publish Windows updater
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SkyDek DJ ${{ github.ref_name }}
          releaseBody: |
            SkyDek DJ 0.10.21 adds one universal macOS installer alongside Windows, with the same DJ interface, controller mapping, recording, Mix Editor, and signed in-app update feed.

            Choose the Windows installer or the macOS DMG from the release assets. Existing official installations can check for signed updates in the app.

            The Mac build uses ad-hoc Apple code signing. macOS may ask users to allow the app in Privacy & Security on first launch. Physical microphone, controller, display scaling, and long-mix performance checks remain recommended before a live set.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis
